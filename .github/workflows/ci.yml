name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest #서버 컴퓨터의 OS 미리 검사

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          distribution: 'temurin'  # 또는 다른 JDK 배포판을 선택할 수 있습니다.
          java-version: '17'       # 프로젝트의 Java 버전에 맞게 설정합니다.

      - name: Cache Gradle packages
        uses: actions/cache@v2
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle- #빌드 전 테스트 코드 실행 

      - name: Build and test with Gradle
        run: ./gradlew build

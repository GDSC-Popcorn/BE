server:
  port: 8080

spring:
  config:
    import:
      - optional:file:dev.env[.properties]
  datasource:
    password: ${DB_PASSWORD}
    url: ${DB_URL}
    username: ${DB_USERNAME}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        hbm2ddl:
          auto: create
    show-sql: true
    
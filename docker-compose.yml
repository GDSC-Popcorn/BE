version: '3.8'
services:
  db:
    image: postgres:17
    container_name: db
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_HOST=${DB_HOST}
      - POSTGRES_DB=${DATABASE}
      - POSTGRES_INIT-DB_ARGS=--encoding=UTF-8
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    restart: on-failure
    networks:
        - pipeline
  redis:
    image: redis:7.4.0
    container_name: cache
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    restart: always
    networks:
      - pipeline

networks:
  pipeline:
    driver: bridge
services:
  db:
    image: postgres:17
    container_name: db
    env_file:
      - dev.env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_HOST=${DB_HOST}
      - POSTGRES_DB=${DATABASE}
      - POSTGRES_INIT-DB_ARGS=--encoding=UTF-8
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    restart: on-failure
    networks:
        - pipeline

networks:
  pipeline:
    driver: bridge